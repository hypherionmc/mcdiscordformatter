plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id "com.hypherionmc.modutils.orion" version "2.0.1"
    id 'maven-publish'
}

orion.setup {
    enableMirrorMaven = true

    versioning {
        uploadBuild(true)
    }
}

group = project_group
version = "${version_major}.${version_minor}.${version_patch}"

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

configurations {
    shade
    implementation.extendsFrom shade
}

repositories {
    mavenCentral()
}

dependencies {
    shade "dev.vankka:SimpleAST:2.2.8"
    implementation("net.kyori:adventure-api:${adventure}")
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : project.archivesBaseName,
                'Specification-Version'   : project.version,
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'Timestamp'               : System.currentTimeMillis(),
                'Built-On-Java'           : "${System.getProperty('java.vm.version')} (${System.getProperty('java.vm.vendor')})"
        ])
    }
}

/**
 * ===============================================================================
 * =       DO NOT EDIT BELOW THIS LINE UNLESS YOU KNOW WHAT YOU ARE DOING        =
 * ===============================================================================
 */
shadowJar {
    from sourceSets.main.output
    configurations = [project.configurations.shade]
    setArchiveClassifier('')

    def relocPath = "com.hypherionmc.mcdiscordformatter.reloc."
    relocate "dev.vankka", relocPath + "dev.vankka"
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 17
}

tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId project.archivesBaseName
            version project.version

            artifact(shadowJar) {
                builtBy shadowJar
            }
        }
    }

    repositories {
        maven orion.getPublishingMaven()
    }
}